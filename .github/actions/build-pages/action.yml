name: 'Build Pages'  # TODO Just build, producing an artifact ID that can be deployed. But the build action should apply to any commit, not just latest.
description: 'Builds the Github Pages artifact for a specific commit'
author: 'kwvanderlinde'

inputs:
  ref:
    description: 'The commit to check out and build'
    required: false  # TODO Make optional, and don't checkout if not provided.
    default: ""

outputs: {}

# # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# permissions:
#   contents: read
#   pages: write
#   id-token: write

# # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# concurrency:
#   group: "pages"
#   cancel-in-progress: false

runs:
  using: 'composite' # No idea what this means.
  steps:
    - name: Checkout
      if: inputs.ref != ''
      uses: actions/checkout@v7
      with:
        ref:  ${{ inputs.ref }}
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2' # Not needed with a .ruby-version file
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
        cache-version: 1 # Increment this number if you need to re-download cached gems
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6
    - name: Build with Jekyll
      shell: bash
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./_site
